<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📻 Mis Radios Argentinas</title>
    <meta name="theme-color" content="#1a73e8">
    <link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Mis Radios&quot;,&quot;short_name&quot;:&quot;Radios&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #121212; color: white; min-height: 100vh; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 15px; color: #1a73e8; }
        .top-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box { flex: 1; padding: 12px; font-size: 16px; border: none; border-radius: 8px; background: #1e1e1e; color: white; outline: 2px solid #333; }
        .search-box:focus { outline-color: #1a73e8; }
        .reload-btn { padding: 12px 16px; background: #1a73e8; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 14px; white-space: nowrap; }
        .reload-btn:active { background: #1557b0; }
        .info-text { text-align: center; font-size: 12px; color: #888; margin-bottom: 15px; }
        .lista { margin-top: 10px; }
        .grupo-titulo { color: #1a73e8; font-size: 18px; font-weight: bold; margin: 25px 0 10px 0; padding-bottom: 5px; border-bottom: 1px solid #333; }
        .radio-item { display: flex; align-items: center; padding: 12px; margin-bottom: 8px; background: #1e1e1e; border-radius: 8px; transition: background 0.2s; }
        .radio-item:hover { background: #2a2a2a; }
        .logo { width: 40px; height: 40px; margin-right: 15px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #333; overflow: hidden; }
        .logo img { width: 100%; height: 100%; object-fit: contain; }
        .name { flex: 1; font-size: 15px; }
        .play-btn { width: 44px; height: 44px; border-radius: 50%; background: #1a73e8; border: none; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .play-btn.external { background: #28a745; font-size: 14px; font-weight: bold; }
        .play-btn.playing { background: #e53935; }
        .player-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a73e8; padding: 12px 20px; display: flex; align-items: center; gap: 12px; transform: translateY(100%); transition: transform 0.3s; z-index: 100; }
        .player-bar.show { transform: translateY(0); }
        .player-name { flex: 1; font-weight: bold; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .stop-btn { background: white; color: #e53935; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .hidden { display: none !important; }
        .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; }
        .error { text-align: center; padding: 40px; color: #ff6b6b; }
    </style>
</head>
<body>

    <h1>📻 Mis Radios Argentinas</h1>
    
    <div class="top-bar">
        <input type="text" id="buscador" class="search-box" placeholder="🔍 Buscar radio..." oninput="filtrar(this.value)">
        <button class="reload-btn" onclick="cargarLista()">🔄 Recargar</button>
    </div>
    
    <div class="info-text" id="versionInfo">Cargando...</div>
    
    <div id="lista" class="loading">Cargando radios...</div>

    <div class="player-bar" id="reproductorBar">
        <span class="player-name" id="nombreActual">Nada reproduciendo</span>
        <button class="stop-btn" onclick="detener()">⏹ Detener</button>
    </div>

    <audio id="reproductor" crossorigin="anonymous">

    <script>
        // ✅ TU LISTA DE RADIOS
        const ENLACE_BASE = "https://gist.githubusercontent.com/mg3629310-glitch/091a54ffce2e7cdb9862937df63eb98b/raw/78f5598cb4fed53f9f12d393e5ea6972ab1812a8/Radios.Argentinas.m3u";
        
        // 📻 TU PÁGINA OFICIAL — ¡Qué lindo! ✨
        const URL_RADIO_LATINA = "http://4514Alex8.on-air.fm/";
        
        let radios = [];
        let audio = document.getElementById('reproductor');
        let reproduciendo = null;
        let reproductorBar = document.getElementById('reproductorBar');
        let nombreActual = document.getElementById('nombreActual');
        let lista = document.getElementById('lista');
        let versionInfo = document.getElementById('versionInfo');

        window.onload = function() {
            cargarLista();
        };

        function cargarLista() {
            lista.innerHTML = '<div class="loading">Descargando lista más reciente...</div>';
            const enlaceFresco = ENLACE_BASE + '?t=' + Date.now();
            versionInfo.textContent = '✅ Buscando actualizaciones...';
            
            fetch(enlaceFresco, { cache: 'no-store' })
                .then(r => {
                    if (!r.ok) throw new Error('Error al cargar');
                    return r.text();
                })
                .then(texto => {
                    radios = parsearM3U(texto);
                    mostrarLista(radios);
                    versionInfo.textContent = '✅ Lista actualizada: ' + new Date().toLocaleTimeString();
                })
                .catch(err => {
                    lista.innerHTML = '<div class="error">❌ No se pudo cargar la lista.</div>';
                    console.error(err);
                });
        }

        function parsearM3U(texto) {
            const lineas = texto.split('\n').filter(l => l.trim() && !l.startsWith('#EXTM3U'));
            const listaTemp = [];
            let nombre = '', logo = '', grupo = '';
            
            for (let linea of lineas) {
                if (linea.startsWith('#EXTINF')) {
                    const partes = linea.split(',');
                    nombre = partes.length > 1 ? partes[partes.length - 1].trim() : 'Radio';
                    
                    const grupoMatch = linea.match(/group-title="([^"]+)"/i) || linea.match(/group-title=([^"\s]+)/i);
                    grupo = grupoMatch ? grupoMatch[1] : 'Otros';
                    
                    const logoMatch = linea.match(/tvg-logo="([^"]+)"/i);
                    logo = logoMatch ? logoMatch[1] : '';
                } else if (linea.startsWith('http') && nombre) {
                    listaTemp.push({ nombre, url: linea.trim(), logo, grupo });
                    nombre = '';
                    logo = '';
                    grupo = '';
                }
            }
            return listaTemp.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
        }

        function mostrarLista(listaRadios) {
            lista.innerHTML = '';
            
            const grupos = {};
            listaRadios.forEach(r => {
                if (!grupos[r.grupo]) grupos[r.grupo] = [];
                grupos[r.grupo].push(r);
            });
            
            Object.keys(grupos).sort().forEach(nombreGrupo => {
                const divGrupo = document.createElement('div');
                divGrupo.className = 'grupo-titulo';
                divGrupo.textContent = nombreGrupo;
                divGrupo.setAttribute('data-grupo', nombreGrupo);
                lista.appendChild(divGrupo);
                
                grupos[nombreGrupo].forEach((radio, idxEnGrupo) => {
                    const idx = listaRadios.indexOf(radio);
                    const div = document.createElement('div');
                    div.className = 'radio-item';
                    div.setAttribute('data-nombre', radio.nombre.toLowerCase());
                    div.setAttribute('data-grupo', radio.grupo);
                    
                    // 📻 Si es tu radio → abre tu página oficial en pestaña nueva
                    const esTuRadio = radio.nombre.includes('Radio Latina FM');
                    
                    div.innerHTML = `
                        <div class="logo">
                            ${radio.logo 
                                ? `<img src="${radio.logo}" alt="" onerror="this.parentElement.innerHTML='📻'">` 
                                : '📻'}
                        </div>
                        <span class="name">${radio.nombre}</span>
                        ${esTuRadio 
                            ? `<a href="${URL_RADIO_LATINA}" target="_blank" class="play-btn external" title="Abrir página de radio">▶</a>`
                            : `<button class="play-btn" id="btn-${idx}" onclick="reproducir(${idx})">▶</button>`
                        }
                    `;
                    lista.appendChild(div);
                });
            });
        }

        function filtrar(texto) {
            const items = document.querySelectorAll('.radio-item, .grupo-titulo');
            const busqueda = texto.toLowerCase();
            
            let gruposVisibles = new Set();
            
            document.querySelectorAll('.radio-item').forEach(item => {
                const nombre = item.getAttribute('data-nombre');
                const grupo = item.getAttribute('data-grupo');
                if (nombre.includes(busqueda)) {
                    item.classList.remove('hidden');
                    gruposVisibles.add(grupo);
                } else {
                    item.classList.add('hidden');
                }
            });
            
            document.querySelectorAll('.grupo-titulo').forEach(titulo => {
                if (busqueda === '' || gruposVisibles.has(titulo.getAttribute('data-grupo'))) {
                    titulo.classList.remove('hidden');
                } else {
                    titulo.classList.add('hidden');
                }
            });
        }

        function reproducir(indice) {
            const radio = radios[indice];
            
            if (reproduciendo === indice) {
                detener();
                return;
            }

            audio.pause();
            audio.src = '';
            
            if (reproduciendo !== null) {
                document.querySelector(`#btn-${reproduciendo}`)?.classList.remove('playing');
                document.querySelector(`#btn-${reproduciendo}`).textContent = '▶';
            }

            reproduciendo = indice;
            document.querySelector(`#btn-${indice}`).classList.add('playing');
            document.querySelector(`#btn-${indice}`).textContent = '⏸';
            
            nombreActual.textContent = radio.nombre;
            reproductorBar.classList.add('show');
            
            audio.src = radio.url;
            audio.play().catch(err => {
                alert('No se pudo reproducir. Probá otra radio.');
                detener();
            });
        }

        function detener() {
            audio.pause();
            audio.src = '';
            
            if (reproduciendo !== null) {
                document.querySelector(`#btn-${reproduciendo}`)?.classList.remove('playing');
                document.querySelector(`#btn-${reproduciendo}`).textContent = '▶';
            }
            
            reproduciendo = null;
            reproductorBar.classList.remove('show');
            nombreActual.textContent = 'Nada reproduciendo';
        }
    </script>
</body>
</html>
